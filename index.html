  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:70px;
  --sky-a:#8fcbff; --sky-b:#ffd9ea;
  --sc-far:#a8c8f2; --sc-wall:#f3d9a2; --sc-wall-d:#b07f3c; --sc-ground:#6fd39b; --sc-line:#3f569e;
  --sc-eiffel:#8f98d3; --sc-colos:#f6b46e; --sc-colos-d:#c2702b;
  --sc-basil:#f3c1c9; --sc-basil-d:#d98b98; --sc-dome1:#9ed9bf; --sc-dome2:#9cc6f0; --sc-dome3:#f5cf6e; --sc-dome4:#ff5c8a; --sc-dome5:#b6a6ea;
  --sc-sun:#ffc928; --sc-cloud:#ffffff; --sc-plane:#ffffff; --sc-trail:#5d7fd6;
  --sc-water:#3dbdf5; --sc-wave:#e3f6ff; --sc-pier:#e9c48f; --sc-pier-d:#bf8c4f; --sc-sail:#ffffff; --sc-sail-d:#6f8fd6;
  --sc-hull:#2a58c4; --sc-hull-line:#ff4f73; --sc-deck:#ffffff; --sc-funnel:#ff3d3d; --sc-window:#3dbdf5;
  --sc-sand:#ffd27a; --t3:#3f9a76; --t3-pastel:#c9eedd; --t3-edge:#8fceb3; --t4:#8a6fd1; --t4-pastel:#e2daf8; --t4-edge:#b9aae6; --sc-hill:#9fdcb4; --sc-hill-d:#6cc493; --star:#ff3b5c; --star-edge:#b8183a; --star-ink:#ffffff; --sc-marble:#ffffff; --sc-marble-d:#d9d4ec; --sc-gold:#ffc21f; --sc-gold-d:#d1900a; --sc-lime:#c9c1b3; --sc-cave:#6e6457; --sc-rock:#7f9c74; --sc-stone:#f4f1ea; --sc-stone-d:#b9b2a3; --sc-pyr:#f5c46a; --sc-pyr-d:#d99a32; --sc-lib:#57c4a5; --sc-ben:#e6b979; --sc-ben-d:#9f6d34; --sc-fuji:#6f86e0; --sc-blossom:#ffb3cf; --sc-moai:#8e8a83; --sc-moai-d:#5c5852; --map-sea-a:#bfe6ff; --map-sea-b:#9fd6fb; --map-land:#e9e4f2; --map-stroke:#ffffff; --sc-pisa:#fffaf0; --sc-pisa-d:#c7a46e; --sc-mount:#8ea6ec; --sc-snow:#ffffff; --sc-hib1:#ff2e63; --sc-hib2:#ff8a1f; --sc-hib-c:#b30f3a; --sc-plum:#ffffff; --sc-roof:#ea5a43; --sc-bronze:#d9a03c; --sc-bronze-d:#a3721f; --sc-spout:#bfeaff; --sc-gondola:#262033; --sc-trunk:#a5622a; --sc-frond:#22b866;
}



*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kirk);outline-offset:2px}

/* 3D press: a solid bottom edge that sinks on tap */
.btn3d,.plus,.btn,.lockbtn,.seg button[aria-pressed="true"],.chip,.res[aria-pressed="true"]{transition:transform .08s ease,box-shadow .08s ease}
.btn3d:active,.plus:active,.btn:active:not(:disabled),.lockbtn:active:not(:disabled),.chip:active{transform:translateY(3px)}
@media (prefers-reduced-motion:reduce){.plus,.btn,.lockbtn,.chip{transition:none}}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}

/* Board */
.board{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 100%);color:var(--board-ink);border-radius:18px;padding:8px 18px 58px;min-height:150px;display:grid;align-content:start;gap:6px;box-shadow:0 4px 0 var(--board-line)}
.board>:not(.scene):not(.sky):not(.sun):not(.plane):not(.pano):not(.skyline){position:relative;z-index:1}
.scene{position:absolute;bottom:0;height:100%;width:auto;aspect-ratio:190/150;max-width:56%;pointer-events:none;z-index:0}
.scene-m{left:0;right:0;width:100%;max-width:none;aspect-ratio:auto}
.scene-c{left:50%;transform:translateX(-50%);aspect-ratio:120/150}
.scene-l{left:0}
.scene-r{right:0}
.score-name{text-shadow:0 1px 0 var(--surface),0 0 4px var(--surface),0 0 8px var(--surface),0 0 12px var(--surface)}
.eyebrow{text-shadow:0 0 4px var(--surface),0 0 8px var(--surface)}
.board-top{display:flex;justify-content:center}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--board-muted);font-weight:500}
.board-sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--board-muted);text-transform:uppercase}
/* the score grid mirrors .cols exactly (full width, same gap) so each score centers over its column */
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-inline:-18px}
.score{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.score-name{font-family:var(--display);font-weight:800;font-size:16px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.score.at .score-name{color:var(--at)}
.score.kirk .score-name{color:var(--kirk)}
.flaps{display:flex;gap:4px;justify-content:center;flex:none}
.flap{position:relative;box-shadow:0 3px 0 var(--tile-edge),0 6px 14px rgba(40,30,80,.18)!important;width:34px;height:46px;background:var(--tile);border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;overflow:hidden;box-shadow:0 3px 0 var(--tile-edge)}
.score.at .flap{color:var(--at)}
.score.kirk .flap{color:var(--kirk)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board);opacity:.9}
.flap.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:rotateX(70deg);opacity:.3}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flap.flip{animation:none}}
.board-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--board-muted);border-top:1px dashed var(--board-line);padding-top:10px}
.board-stats b{color:var(--board-ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* Columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden}
.col-head{padding:12px 10px 10px;border-bottom:1px solid var(--line);text-align:center;display:grid;gap:2px;justify-items:center}
.col-head .who{display:flex;justify-content:center;align-items:baseline;gap:8px}
.col-head h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.col-head .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px}
.col.at .col-head{background:var(--at-pastel)} .col.at .n{color:var(--at);background:var(--surface)}
.col.kirk .col-head{background:var(--kirk-pastel)} .col.kirk .n{color:var(--kirk);background:var(--surface)}
.list{list-style:none;margin:0;padding:4px 0}
.item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 8px}
.item:hover{background:var(--bg)}
.flag{flex:none;display:flex;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.flagimg{display:block;width:44px;aspect-ratio:4/3;max-width:100%;object-fit:contain}
.item .txt{min-width:0;flex:1 1 0}
.item .name{font-size:16px;line-height:1.25;font-weight:600;overflow-wrap:break-word;hyphens:manual;display:block}
.item .city{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;font-size:13.5px;line-height:1.3;color:var(--ink)}
.item .cn{overflow-wrap:break-word;min-width:0}
.more{display:flex;align-items:center;gap:6px;width:calc(100% - 24px);margin:-4px 8px 6px 60px;padding:4px 8px;border:0;border-radius:8px;background:var(--bg);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left;width:auto;max-width:calc(100% - 68px)}
.more span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more svg{width:14px;height:14px;flex:none;transition:transform .15s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.city-list{list-style:none;margin:0 8px 8px 60px;padding:0 0 0 10px;border-left:2px solid var(--line);display:grid;gap:3px}
.city-list li{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;font-size:13.5px;line-height:1.3}
.city-list .cn{overflow-wrap:break-word;min-width:0}
.city-list .cd{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (max-width:380px){.more,.city-list{margin-left:51px;margin-right:6px}.more{max-width:calc(100% - 57px)}}
@media (min-width:640px){.more,.city-list{margin-left:76px;margin-right:12px}.more{max-width:calc(100% - 88px)}}
.item .cd{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.item .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--btn);color:var(--muted)}
.tag.both{background:var(--mint);color:var(--mint-ink)}
.lockmini{width:11px;height:11px;vertical-align:-1px}
.empty{padding:18px 12px 20px;color:var(--muted);font-size:13px;text-align:center}
.empty b{color:var(--ink)}

/* Continents view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:18px;padding:6px 14px}
.cont{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.cont:last-child{border-bottom:0}
.cont-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cont-head h3{margin:0;font-size:15px}
.cont-head span{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar .track{height:9px;background:var(--btn);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

.foot{text-align:center;margin-top:22px;font-size:12px;color:var(--muted);display:grid;gap:4px}
.last-change{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.thor{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 10px;border-radius:8px;justify-self:center;cursor:pointer}
.thor:hover{color:var(--ink);background:var(--btn);box-shadow:0 2px 0 var(--btn-edge)}
.lock-note{display:inline-flex;gap:5px;align-items:center;justify-self:center;font-size:12px;font-weight:600;color:var(--mint-ink);background:var(--mint);padding:3px 10px;border-radius:999px}
.lock-note svg{width:13px;height:13px}
.save-grid{display:grid;gap:12px}
.save-opt{display:grid;gap:2px;text-align:left;background:var(--btn);color:var(--ink);box-shadow:0 5px 0 var(--btn-edge);cursor:pointer}
.save-opt:active{box-shadow:0 2px 0 var(--btn-edge)}
.save-opt span{font-weight:500;font-size:13px;color:var(--muted)}
#saveHtml{background:var(--kirk-pastel);box-shadow:0 5px 0 var(--kirk-edge)}
#saveJson{background:var(--mint);box-shadow:0 5px 0 var(--mint-edge)}
#xlsLbl{background:var(--accent);box-shadow:0 5px 0 var(--accent-edge)}
#xlsLbl span{color:var(--accent-ink)}
#syncBtn{background:var(--at-pastel);box-shadow:0 5px 0 var(--at-edge)}
.linkbtn{border:0;background:none;color:var(--kirk);font-weight:600;font-size:13px;text-decoration:underline;justify-self:start;padding:0 4px;margin-top:-4px}
.imp-body{display:grid;gap:14px}
.imp-note{margin:0;font-size:14px;color:var(--muted)}
.imp-note b{color:var(--ink)}
.imp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imp-sum div{background:var(--bg);border-radius:12px;padding:10px;display:grid;justify-items:center}
.imp-sum b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.imp-sum span{font-size:12px;color:var(--muted)}
.imp-warn{display:grid;gap:4px;background:var(--at-pastel);border-radius:12px;padding:10px 12px;font-size:13px}
.imp-warn span{overflow-wrap:break-word}
.cfg{font-family:var(--mono);font-size:13px;resize:vertical}
.lock-row{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.lock-txt{display:grid;gap:2px;font-size:13px;color:var(--muted);min-width:0}
.lock-txt b{color:var(--ink);font-size:15px}
.foot .sync{max-width:44ch;margin:0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:760px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:12px;justify-self:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink);background:var(--btn);box-shadow:0 3px 0 var(--btn-edge)}
.plus{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-28px;box-shadow:0 6px 0 var(--accent-edge),0 10px 18px rgba(58,52,80,.18)}
.plus:active{box-shadow:0 3px 0 var(--accent-edge),0 5px 10px rgba(58,52,80,.15)}
.plus svg{width:28px;height:28px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(40,34,60,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:19px}
.x{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:6px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px 4px 6px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);box-shadow:0 3px 0 var(--mint-edge)}
.seg button.tbtn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lbl-tip{text-transform:none;letter-spacing:0;font-family:var(--body);opacity:.85}
.seg button.tbtn[aria-pressed="true"]{background:var(--tp);color:var(--ink);box-shadow:0 3px 0 var(--te)}
.seg{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))!important}
.seg button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.field:disabled{opacity:.6}
.results{list-style:none;margin:8px 0 0;padding:0;max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.results li+li{border-top:1px solid var(--line)}
.res{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;padding:9px 12px}
.res[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.res[aria-pressed="true"] .sub{color:var(--accent-ink)}
.res .nm{flex:1;min-width:0;font-weight:600;font-size:16px;overflow-wrap:break-word}
.res .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.check{width:20px;height:20px;flex:none;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700}
.res[aria-pressed="true"] .check{border-color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px 6px;margin-top:10px;padding-bottom:3px}
.chips:empty{display:none}
.chip{border:0;background:var(--kirk-pastel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;box-shadow:0 3px 0 var(--kirk-edge)}
.chip:active{box-shadow:0 0 0 var(--kirk-edge)}
.city-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.city-add .city-name{grid-column:1/-1;min-width:0}
.city-add .city-month{min-width:0}
input[type="month"].city-month{-webkit-appearance:none;appearance:none;min-height:46px}
@media (min-width:520px){.city-add{grid-template-columns:1.4fr 1fr auto}.city-add .city-name{grid-column:auto}}
.btn.add-city{background:var(--kirk-pastel);color:var(--ink);box-shadow:0 4px 0 var(--kirk-edge);padding:10px 18px}
.btn.add-city:active:not(:disabled){box-shadow:0 1px 0 var(--kirk-edge)}
.city-rows{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.city-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 8px 8px 12px;background:var(--surface)}
.city-row+.city-row{border-top:1px solid var(--line)}
.cr-name{font-weight:600;min-width:0;overflow-wrap:break-word}
.cr-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cr-x{width:32px;height:32px;border:0;border-radius:9px;background:var(--at-pastel);color:var(--danger);font-size:18px;line-height:1;box-shadow:0 3px 0 var(--at-edge)}
.cr-x:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--at-edge)}
.cr-x:disabled{opacity:.4}
.city-hint{padding:10px 12px;font-size:13px;color:var(--muted)}
.off .city-add{opacity:.6}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
.row2>div{min-width:0}
@media (min-width:520px){.row2{grid-template-columns:1fr 1fr}}
input[type="month"].field{-webkit-appearance:none;appearance:none;min-height:46px;display:block;min-width:0;max-width:100%;text-align:left}
.picked{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700}
.picked .flagimg{width:52px}
.chip .flagimg{display:inline-block;width:22px;vertical-align:-5px;margin-right:2px}
.actions{display:flex;gap:10px;align-items:center;padding-bottom:4px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--mint);color:var(--mint-ink);flex:1;box-shadow:0 5px 0 var(--mint-edge)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--mint-edge)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--at-pastel);color:var(--danger);box-shadow:0 5px 0 var(--at-edge)}
.btn.danger:active:not(:disabled){box-shadow:0 2px 0 var(--at-edge)}
.btn.danger:disabled{opacity:.45}
.lockbtn{width:50px;height:48px;border-radius:14px;border:0;background:var(--btn);display:grid;place-items:center;flex:none;box-shadow:0 5px 0 var(--btn-edge)}
.lockbtn:active:not(:disabled){box-shadow:0 2px 0 var(--btn-edge)}
.lockbtn svg{width:22px;height:22px}
.lockbtn[data-state="locked"]{color:var(--danger);background:var(--at-pastel);box-shadow:0 5px 0 var(--at-edge)}
.lockbtn[data-state="open"]{color:var(--mint-ink);background:var(--mint);box-shadow:0 5px 0 var(--mint-edge)}
.lockbtn:disabled{cursor:default}
.lockline{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.lockline svg{width:14px;height:14px;flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

@media (max-width:380px){.flap{width:30px;height:42px;font-size:32px}.score-name{font-size:15px}.item{padding:8px 6px;gap:7px}.flagimg{width:38px}.item .name{font-size:15px}}
@media (min-width:640px){.cols,.scores{gap:14px}.item{padding:9px 12px;gap:12px}.item .name{font-size:17px}.flagimg{width:52px}.picked .flagimg{width:60px}.chip .flagimg{width:22px}}
/* ---------- travelers: any number from 1 to 4 ---------- */
.scores,.cols{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.score .score-name,.score .flap{color:var(--tc)}
.score-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.col .col-head{background:var(--tp)}
.col .n{color:var(--tc);background:var(--surface)}
.solo .scores,.solo .cols{grid-template-columns:minmax(0,1fr)}
:root{--pad:8px;--gap:8px;--flagw:44px}
@media (max-width:380px){:root{--pad:6px;--gap:7px;--flagw:38px}}
@media (min-width:640px){:root{--pad:12px;--gap:12px;--flagw:52px}}
@media (max-width:639px){
  /* 3 or 4 travelers on a phone: scores stay in one row, lists go two per row */
  .many .flap{width:24px;height:34px;font-size:26px;border-radius:6px}
  .many .score-name{font-size:13px}
  .many .scores{gap:4px}
  .many .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .many .col:last-child:nth-child(odd){grid-column:1/-1}
}
.item{padding-left:var(--pad);padding-right:var(--pad);gap:var(--gap)}
.item .flagimg{width:var(--flagw)}
.more,.city-list{margin-left:calc(var(--pad) + var(--flagw) + var(--gap));margin-right:var(--pad)}
.more{max-width:calc(100% - var(--pad) * 2 - var(--flagw) - var(--gap))}
.bar{grid-template-columns:72px 1fr 28px}
.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-sum{grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.imp-sum span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trav-box{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.trav-head{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.trav-head b{color:var(--ink);font-size:15px}
.trav-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trav-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.trav-dot{width:18px;height:18px;border-radius:50%;background:var(--tp);box-shadow:0 2px 0 var(--te),inset 0 0 0 2px var(--tc)}
.trav-off{display:flex;flex-wrap:wrap;gap:8px}
.trav-box .actions .btn.add-city{flex:none}
.trav-box :disabled{opacity:.5;cursor:not-allowed}
/* ---------- world map ---------- */
.map-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.map-top{display:flex;gap:10px;align-items:center}
.map-seg{flex:1;min-width:0}
.map-zoom{display:flex;gap:6px;flex:none}
.zbtn{width:40px;height:40px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 0 var(--btn-edge)}
.zbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.map-sum{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.map-sum b{color:var(--ink)}
.map-key{width:14px;height:14px;border-radius:4px;display:inline-block}
.map-scroll{overflow:auto;border-radius:12px;max-height:62vh;-webkit-overflow-scrolling:touch;background:var(--map-sea-b)}
.world{display:block;width:100%;height:auto;max-width:none}
.world .land{fill:var(--map-land);stroke:var(--map-stroke);stroke-width:.35;vector-effect:non-scaling-stroke;transition:fill .25s}
.world .land.pick{cursor:pointer}
.world .land.on{fill:var(--visit)}
.world .land.sel{stroke:var(--ink);stroke-width:1.6}
.world .dot{fill:var(--visit);stroke:var(--map-stroke);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.world .dot.sel{stroke:var(--ink);stroke-width:2}
.map-info{display:flex;gap:10px;align-items:center;min-height:44px;font-size:14px;color:var(--muted)}
.map-info .flag .flagimg{width:40px}
.mi-txt{display:grid;gap:1px;min-width:0}
.mi-txt b{color:var(--ink);font-size:16px}
.mi-txt span{overflow-wrap:break-word}
.nav .tab{justify-self:stretch;max-width:150px;width:100%;margin:0 auto;padding:7px 10px;border-radius:16px;font-size:13px;font-weight:700;color:var(--ink);transition:transform .08s,box-shadow .08s}
.nav .tab svg{width:24px;height:24px}
#tabList{background:var(--kirk-pastel);box-shadow:0 4px 0 var(--kirk-edge)}
#tabList svg{color:var(--kirk)}
#tabMap{background:var(--mint);box-shadow:0 4px 0 var(--mint-edge);color:var(--mint-ink)!important}
#tabMap svg{color:var(--mint-ink)}
.nav .tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.nav .tab[aria-current="page"]{outline:2.5px solid var(--ink);outline-offset:2px}
.nav .tab:not([aria-current="page"]){opacity:.82}
@media (prefers-reduced-motion:reduce){.world .land{transition:none}}
/* ---------- larger text on phones ---------- */
@media (max-width:639px){
  body{font-size:16px}
  .eyebrow{font-size:12px}
  .score-name{font-size:18px}
  .item .name{font-size:17px}
  .item .city,.city-list li{font-size:15px}
  .item .cd,.city-list .cd,.item .meta{font-size:12.5px}
  .tag{font-size:11px;padding:2px 6px}
  .more{font-size:14px}
  .col-head h2{font-size:19px}
  .col-head .n{font-size:24px}
  .empty{font-size:15px}
  .lbl{font-size:12px}
  .res .nm{font-size:17px}
  .res .sub{font-size:12px}
  .field{font-size:17px}
  .btn{font-size:16px}
  .imp-note,.lock-txt,.trav-head{font-size:15px}
  .save-opt span{font-size:14px}
  .tab{font-size:12px}
  .foot,.thor{font-size:14px}
  .foot .sync{font-size:12px}
  .last-change{font-size:13px}
  .map-sum,.map-info{font-size:15px}
  .mi-txt b{font-size:18px}
  .cont-head h3{font-size:17px}
  .cont-head span,.bar{font-size:14px}
  .toast{font-size:15px}
  .many .item .name{font-size:15px}
  .many .item .city,.many .city-list li{font-size:13.5px}
  .many .score-name{font-size:14px}
}
/* ---------- compact Save window buttons ---------- */
.save-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.save-opt{padding:10px 12px;border-radius:12px;gap:0;align-content:center;min-height:52px}
.save-opt b{font-size:15px;line-height:1.2}
.save-opt span{display:none}
#soundBtn{background:var(--kirk-pastel);box-shadow:0 3px 0 var(--kirk-edge)!important}
#soundBtn span{display:block;font-size:12px!important;font-weight:600}
#syncBtn span{display:block;font-size:12px!important;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-grid .linkbtn{align-self:center;justify-self:center;margin:0}
.save-opt{box-shadow:0 3px 0 var(--btn-edge)!important}
#saveHtml{box-shadow:0 3px 0 var(--kirk-edge)!important}
#saveJson{box-shadow:0 3px 0 var(--mint-edge)!important}
#xlsLbl{box-shadow:0 3px 0 var(--accent-edge)!important}
#syncBtn{box-shadow:0 3px 0 var(--at-edge)!important}

/* ---------- scoreboard band: a slowly scrolling panorama of world landmarks ---------- */
.board{padding-bottom:84px!important;min-height:0!important}
.pano{position:absolute;left:0;right:0;bottom:0;height:80px;overflow:hidden;z-index:0;pointer-events:none}
.pano-track{display:flex;width:calc(var(--pw) * 2);height:80px;animation:pano 110s linear infinite;will-change:transform}
.pano-track svg{flex:none;display:block;height:80px;width:var(--pw);max-width:none}
@keyframes pano{from{transform:translateX(0)}to{transform:translateX(calc(var(--pw) * -1))}}
.sky{position:absolute;inset:0 0 auto 0;width:100%;height:60px;z-index:0;pointer-events:none}
.cloud{animation:drift 40s ease-in-out infinite alternate}
.c2{animation-duration:55s}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
.sun{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));width:38px;height:38px;z-index:0;pointer-events:none}
.plane{position:absolute;top:10px;left:0;width:62px;height:24px;z-index:0;pointer-events:none;animation:fly 26s linear infinite}
@keyframes fly{0%{transform:translateX(-80px) translateY(6px)}50%{transform:translateX(calc(50vw)) translateY(-2px)}100%{transform:translateX(calc(100vw + 40px)) translateY(4px)}}
@media (min-width:760px){@keyframes fly{0%{transform:translateX(-80px)}100%{transform:translateX(800px)}}}
@media (prefers-reduced-motion:reduce){.pano-track,.cloud,.plane{animation:none}.plane{transform:translateX(16px)}}

/* ---------- still skyline: two layers of landmarks ---------- */
/* the skyline fills the whole band, from the ground up to the top; scores float over the sky part */
/* same band height as before; the skyline fills it and rises up behind the scores */
.board{padding-bottom:calc(25vw - 22px)!important;min-height:0!important}
@media (min-width:640px){.board{padding-bottom:118px!important}}
.skyline{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}

/* ---------- times visited: a small number after the country name, in the traveler's color ---------- */
.tnum{margin-left:.35em;font-size:.82em;font-weight:800;color:var(--tc);font-variant-numeric:tabular-nums}
.times-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.times-row .lbl{margin:0}
.stepper{display:flex;align-items:center;gap:10px}
.stp{width:40px;height:40px;border:0;border-radius:12px;background:var(--btn);color:var(--ink);font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 0 var(--btn-edge)}
.stp:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.stp:disabled{opacity:.4}
.stp-n{min-width:2.2em;text-align:center;font-size:22px;font-weight:800;color:var(--tc)}

/* ---------- milestone celebration ---------- */
.cele{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(40,34,70,.38);animation:celeFade .3s ease-out}
.cele-rain{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:103}
.cele-rain img{position:absolute;top:-60px;width:var(--w);aspect-ratio:4/3;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));animation:celeFall var(--d) linear var(--delay) forwards}
.cele-rain img::after{content:""}
@keyframes celeFall{0%{transform:translate(0,0) rotate(var(--r0))}25%{transform:translate(var(--sx),27vh) rotate(calc(var(--r0) + 120deg))}50%{transform:translate(calc(var(--sx) * -1),55vh) rotate(calc(var(--r0) + 230deg))}75%{transform:translate(var(--sx),82vh) rotate(calc(var(--r0) + 330deg))}100%{transform:translate(0,112vh) rotate(calc(var(--r0) + 440deg))}}
@keyframes celeFade{from{opacity:0}to{opacity:1}}
.cele-card{position:relative;z-index:102;width:min(360px,100%);background:#fffdfc;border-radius:28px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 0 var(--te,#e6a2b0),0 24px 60px rgba(40,30,80,.35);animation:celePop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes celePop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.cele-ribbon{display:inline-block;background:var(--tp,#f9c9d3);color:var(--ink,#3a3450);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:6px 16px;border-radius:999px;box-shadow:0 3px 0 var(--te,#e6a2b0)}
.cele-big{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:110px;line-height:.9;margin:14px 0 2px;color:var(--tc,#d97a8c);text-shadow:0 5px 0 var(--te,#e6a2b0)}
.cele-sub{font-size:20px;font-weight:800;margin:0;color:var(--ink,#3a3450)}
.cele-name{font-size:17px;margin:10px 0 0;color:var(--muted,#7c7590)}
.cele-name b{color:var(--tc,#d97a8c)}
.cele-plane{position:absolute;top:-26px;right:18px;width:72px;animation:celePlane 2.4s ease-in-out infinite alternate}
@keyframes celePlane{from{transform:translate(-6px,4px) rotate(-6deg)}to{transform:translate(6px,-4px) rotate(4deg)}}
.cele-btn{margin-top:18px;width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;background:var(--mint,#bfe9d6);color:var(--mint-ink,#245a43);box-shadow:0 5px 0 var(--mint-edge,#8fceb3);cursor:pointer}
.cele-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-edge,#8fceb3)}
@media (prefers-reduced-motion:reduce){.cele-card,.cele-plane{animation:none}.cele-rain img{animation-duration:calc(var(--d) * 2)}}

/* ---------- large text settings: keep words whole and give names room ---------- */
.res .nm{display:grid;gap:1px;flex:1 1 auto;min-width:0}
.res .nm-t{overflow-wrap:break-word;hyphens:manual}
.res .sub{display:block;white-space:normal;font-size:.72em;line-height:1.25}
.res[aria-pressed="true"] .sub{color:var(--accent-ink)}
.item .name,.item .cn,.city-list .cn,.cr-name,.mi-txt span,.res .nm-t{word-break:normal;overflow-wrap:break-word}
/* when the phone's text size is turned up (the page gets "narrow" for its text), stack the lists one above the other */
@media (max-width:23em){
  .cols{grid-template-columns:minmax(0,1fr)!important}
  .more,.city-list{margin-left:calc(var(--pad) + var(--flagw) + var(--gap))}
  .score-name{font-size:.95rem}
}
@media (max-width:18em){
  .scores{grid-template-columns:minmax(0,1fr)!important;gap:6px}
  .item .flagimg{width:36px}
}

/* ---------- windows always fit the visible screen; Save stays reachable ---------- */
.scrim{height:100vh;height:100dvh;inset:auto 0 0 0;top:0}
.sheet{max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:0!important}
.sticky-actions{position:sticky;bottom:0;z-index:2;background:var(--surface);margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px))) 0;padding:12px max(18px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 14px -10px rgba(40,30,80,.25)}
.results{overscroll-behavior:contain}

</style>

  const app=firebase.apps.find(a=>a.name==="cwv")||firebase.initializeApp(cfg,"cwv");
  const ref=app.database().ref(COLL+"/visits"), tref=app.database().ref(COLL+"/settings/travelers");
  const fail=e=>{showSync(/permission/i.test((e&&(e.code||e.message))||"")?"Sync blocked by your Firebase rules. Add countriesVisited to the rules.":"Sync problem. Changes are kept and will retry.")};
  const clean=o=>JSON.parse(JSON.stringify(o)); // Realtime Database refuses undefined values
  // writes return right away; Firebase keeps them and sends when online
  return {
    shared:true, cloud:true,
    start(cb){
      let firstT=true;
      tref.on("value",snap=>{
        const t=cleanTravelers(snap.val());
        if(t){travelers=t;saveTravelersLocal(t);render()}
        else if(firstT){tref.set(travelers).catch(fail)} // first device to connect shares its travelers
        firstT=false;
      },fail);
      let first=true;
      ref.on("value",snap=>{
        const val=snap.val()||{};
        const arr=Object.entries(val).map(([id,v])=>({id,...v}));
        if(first){
          first=false;
          const MK="countries-visited-merged-"+(cfg.projectId||"db");
          let merged=false;try{merged=localStorage.getItem(MK)==="1"}catch(e){}
          if(!merged){ // this device's first connection: add whatever it had that the cloud doesn't
            const ids=new Set(arr.map(v=>v.id));
            for(const v of mem) if(!ids.has(v.id)){const {id,...b}=v;ref.child(id).set(clean(b)).catch(fail);arr.push(v)}
            try{localStorage.setItem(MK,"1")}catch(e){}
          }
        }
        mem=arr.slice(); persist(); // keep a copy on this device too
        cb(arr); showSync();
      },fail);
    },
    async set(id,b){ref.child(id).set(clean({...b,updatedAt:Date.now()})).catch(fail)},
    async update(id,p){ref.child(id).update(clean({...p,updatedAt:Date.now()})).catch(fail)},
    async remove(id){ref.child(id).remove().catch(fail)},
    async saveTravelers(list){travelers=list;saveTravelersLocal(list);render();tref.set(list).catch(fail)}
  };
}
function persistSeed(){if(SEED.length&&canPersist){try{localStorage.setItem(LS_KEY,JSON.stringify(mem))}catch(e){}}}
async function boot(){
  const cfg=syncConfig();
  if(cfg){
    showSync("Connecting to sync…");
    try{store=await cloudStore(cfg)}catch(e){store=localStore;showSync("Offline · showing the copy saved on this device")}
  } else { store=localStore; persistSeed(); }
  if(!store.cloud&&!cfg) showSync();
  store.start(arr=>{visits=arr;render()});
}

/* ---------- Cities: each city keeps its own date ---------- */
const splitCities=t=>String(t||"").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
// older entries stored cities as plain text with one shared date; read them as city objects
function citiesOf(v){
  if(Array.isArray(v.cities)) return v.cities.map(c=>typeof c==="string"?{name:c,month:v.month||""}:{name:c.name||"",month:c.month||""});
  const names=splitCities(v.note);
  return names.length?names.map(n=>({name:n,month:v.month||""})):(v.month?[{name:"",month:v.month}]:[]);
}
const sameCity=(a,b)=>a.name.toLowerCase()===b.name.toLowerCase()&&a.month===b.month;
function mergeCities(a,b){const out=[...a];for(const c of b)if(!out.some(x=>sameCity(x,c)))out.push(c);return out}
const sortCities=l=>[...l].sort((x,y)=>(x.month||"9999").localeCompare(y.month||"9999")||x.name.localeCompare(y.name));
const latestMonth=l=>l.map(c=>c.month).filter(Boolean).sort().pop()||"";
function cityEditor(root,initial){
  let list=sortCities(initial);
  const id=root.dataset.inputId||"";
  root.innerHTML=`<div class="city-add"><input class="field city-name" id="${id}" type="text" placeholder="City" maxlength="60" enterkeyhint="done" aria-label="City"><input class="field city-month" type="month" aria-label="Date of visit"><button type="button" class="btn add-city">Add</button></div><ul class="city-rows"></ul>`;
  const inp=root.querySelector(".city-name"), mon=root.querySelector(".city-month"), btn=root.querySelector(".add-city"), box=root.querySelector(".city-rows");
  let off=false;
  const paint=()=>{box.innerHTML=list.length?list.map((c,i)=>`<li class="city-row"><span class="cr-name">${esc(c.name||"Visit")}</span><span class="cr-date">${c.month?esc(fmtMonth(c.month)):"No date"}</span><button type="button" class="cr-x" data-i="${i}" aria-label="Remove ${esc(c.name||"visit")}" ${off?"disabled":""}>×</button></li>`).join(""):`<li class="city-hint">No cities yet. Type a city, pick its date, tap Add.</li>`};
  const addTyped=()=>{
    const names=splitCities(inp.value), m=mon.value;
    if(!names.length&&!m) return false;
    const add=(names.length?names:[""]).map(n=>({name:n,month:m}));
    list=sortCities(mergeCities(list,add)); inp.value=""; mon.value=""; paint(); return true;
  };
  btn.onclick=()=>{addTyped();inp.focus()};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTyped()}});
  box.addEventListener("click",e=>{const b=e.target.closest(".cr-x");if(!b||b.disabled)return;list.splice(+b.dataset.i,1);paint()});
  paint();
  return{
    get(){addTyped();return [...list]},
    setDisabled(d){off=d;inp.disabled=d;mon.disabled=d;btn.disabled=d;paint();root.classList.toggle("off",d)}
  };
}
// times visited: set by hand in the edit window; otherwise the number of different trip dates
function timesOf(v){const t=+v.times;if(t>=1)return Math.min(99,Math.round(t));const d=new Set(citiesOf(v).map(c=>c.month).filter(Boolean));return Math.max(1,d.size)}
const starBadge=n=>n>1?`<span class="tnum" title="Visited ${n} times" aria-label="visited ${n} times">${n}</span>`:"";
function citySummary(l){
  const months=l.map(c=>c.month).filter(Boolean).sort();
  if(!months.length) return "";
  const f=months[0], t=months[months.length-1];
  if(f===t) return fmtMonth(f);
  return f.slice(0,4)===t.slice(0,4)?f.slice(0,4):`${f.slice(0,4)}–${t.slice(0,4)}`;
}

/* ---------- Render ---------- */
let view="list";
function byWho(w){return visits.filter(v=>v.who===w&&COUNTRIES[v.iso])}
let lastScores={}, localChangeAt=0, celeQueue=[];
function queueCelebrations(h){celeQueue.push(...h);if(!document.querySelector(".cele"))nextCelebration()}
function nextCelebration(){const x=celeQueue.shift();if(!x)return;const [t,n]=x;try{celebrate(t.name,n,styleOf(t.id))}catch(e){}try{playFanfare()}catch(e){}}
function render(){
  const T=activeTravelers(), n=T.length;
  const sets={}; for(const t of T) sets[t.id]=new Set(byWho(t.id).map(v=>v.iso));
  const sovCount=st=>st.size; // everything counts: countries and territories
  document.body.classList.toggle("many",n>=3);
  document.body.classList.toggle("solo",n===1);
  const sc=document.getElementById("scores"); sc.style.setProperty("--n",n);
  sc.innerHTML=T.map(t=>{const v=sovCount(sets[t.id]),prev=lastScores[t.id];
    return `<div class="score" style="${styleOf(t.id)}"><span class="score-name">${esc(t.name)}</span><div class="flaps">${String(v).padStart(2,"0").split("").map(d=>`<div class="flap${prev!==undefined&&prev!==v?" flip":""}">${d}</div>`).join("")}</div></div>`}).join("");
  const hits=[];
  if(Date.now()-localChangeAt<8000) for(const t of T){const was=lastScores[t.id],now=sovCount(sets[t.id]);
    if(was!==undefined&&now>=10&&Math.floor(now/10)>Math.floor(was/10)) hits.push([t,Math.floor(now/10)*10])}
  lastScores={}; for(const t of T) lastScores[t.id]=sovCount(sets[t.id]);
  if(hits.length) try{queueCelebrations(hits)}catch(e){} // a celebration problem must never block saving
  const cols=document.getElementById("cols"); cols.style.setProperty("--n",n);
  cols.innerHTML=T.map(t=>`<section class="col" style="${styleOf(t.id)}" aria-labelledby="h_${t.id}"><div class="col-head"><div class="who"><h2 id="h_${t.id}">${esc(t.name)}</h2><span class="n">${sovCount(sets[t.id])}</span></div></div><ul class="list" id="list_${t.id}"></ul></section>`).join("");
  for(const t of T){
    const others=T.filter(o=>o.id!==t.id).map(o=>sets[o.id]);
    fillList("list_"+t.id,byWho(t.id),others,t);
  }
  renderCont(T,sets);
  if(view==="map") renderMap();
  paintFooter();
}
const openCities=new Set();
function paintFooter(){
  document.getElementById("appVersion").textContent=APP_VERSION;
  const t=Math.max(0,...visits.map(v=>v.updatedAt||v.createdAt||0).filter(x=>x>1e12));
  document.getElementById("lastChange").textContent=!visits.length?"No entries yet":!t?`${visits.length} ${visits.length===1?"entry":"entries"}`:`List last changed ${new Date(t).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})} · ${visits.length} ${visits.length===1?"entry":"entries"}`;
}
function fillList(id,arr,otherSets,t){
  const ul=document.getElementById(id);
  if(!arr.length){ul.innerHTML=`<li class="empty">No countries yet.<br>Tap <b>+</b> to add ${esc(t.name)}'s first one.</li>`;return}
  arr.sort((a,b)=>COUNTRIES[a.iso].name.localeCompare(COUNTRIES[b.iso].name));
  ul.innerHTML=arr.map(v=>{
    const c=COUNTRIES[v.iso]; const locked=!appUnlocked&&Date.now()-(v.createdAt||0)>LOCK_MS;
    const cl=sortCities(citiesOf(v)).filter(x=>x.name), dates=citySummary(citiesOf(v));
    const meta=[!cl.length&&dates?`<span>${esc(dates)}</span>`:"",
      otherSets.some(o=>o.has(v.iso))?`<span class="tag both">${otherSets.length===1?"Both":"Shared"}</span>`:"",
      c.terr?`<span class="tag">Territory</span>`:"",
      locked?`<span title="Locked" aria-label="Locked" class="lockmini">${LOCK_SVG}</span>`:""].join("");
    const isOpen=openCities.has(v.id);
    const one=cl.length===1?`<span class="city"><span class="cn">${esc(cl[0].name)}</span>${cl[0].month?`<span class="cd">${esc(fmtMonth(cl[0].month))}</span>`:""}</span>`:"";
    const more=cl.length>1?`<button class="more" type="button" data-open="${esc(v.id)}" aria-expanded="${isOpen}"><span>${cl.length} cities${dates?` · ${esc(dates)}`:""}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>`+
      (isOpen?`<ul class="city-list">${cl.map(x=>`<li><span class="cn">${esc(x.name)}</span>${x.month?`<span class="cd">${esc(fmtMonth(x.month))}</span>`:""}</li>`).join("")}</ul>`:""):"";
    return `<li class="entry"><button class="item" type="button" data-id="${esc(v.id)}"><span class="flag" aria-hidden="true">${flag(c.iso)}</span><span class="txt"><span class="name">${esc(nameFor(c.name))}${starBadge(timesOf(v))}</span>${one}${meta?`<span class="meta">${meta}</span>`:""}</span></button>${more}</li>`;
  }).join("");
}
function renderCont(T,sets){
  const p=document.getElementById("contPanel");
  const all=new Set(); for(const t of T) for(const i of sets[t.id]) all.add(i);
  p.innerHTML=Object.entries(CONT_NAME).map(([code,name])=>{
    const inPool=i=>COUNTRIES[i].cont===code;
    const n=ALL.filter(c=>inPool(c.iso)).length;
    const u=[...all].filter(inPool).length;
    const bar=t=>{const v=[...sets[t.id]].filter(inPool).length;return `<div class="bar"><span class="bar-name">${esc(t.name)}</span><div class="track"><div class="fill" style="width:${n?v/n*100:0}%;background:${palOf(t.id).c}"></div></div><span class="v">${v}</span></div>`};
    return `<div class="cont"><div class="cont-head"><h3>${name}</h3><span>${u} of ${n}</span></div>${T.map(bar).join("")}</div>`;
  }).join("");
}

let mapWho=null, mapZoom=1, mapBuilt=false, mapPick=null;
function buildMap(){
  const svg=document.getElementById("world");
  svg.setAttribute("viewBox",`0 0 ${WORLD.w} ${WORLD.h}`);
  let h=`<defs><linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--map-sea-a)"/><stop offset="1" stop-color="var(--map-sea-b)"/></linearGradient></defs>`;
  h+=`<rect x="-20" y="-20" width="${WORLD.w+40}" height="${WORLD.h+40}" fill="url(#seaGrad)"/>`;
  for(const [code,d] of Object.entries(WORLD.p)){
    const known=!!COUNTRIES[code];
    h+=`<path class="land${known?" pick":""}" d="${d}" data-iso="${known?code:""}"/>`;
  }
  h+=`<g id="mapDots"></g>`;
  svg.innerHTML=h; mapBuilt=true;
  svg.addEventListener("click",e=>{
    // tiny islands sit almost on top of each other (e.g. British and US Virgin Islands):
    // a tap near one of this traveler's visited islands picks that island
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const m=svg.getScreenCTM(); let near=null;
    if(m){const q=pt.matrixTransform(m.inverse()); let best=14/Math.sqrt(mapZoom);
      for(const v of byWho(mapWho)){const c=dotPos(v.iso);if(!c||WORLD.c[v.iso][2]>7)continue;const d=Math.hypot(c[0]-q.x,c[1]-q.y);if(d<best){best=d;near=v.iso}}}

    const iso=near||(t&&t.dataset.iso); if(!iso)return; mapPick=iso; paintMap()});
}

      lp.frequency.setValueAtTime(f*1.2,start); lp.frequency.linearRampToValueAtTime(f*6,start+.06); lp.frequency.exponentialRampToValueAtTime(f*3,start+dur);

    }
  }
  function drum(start,vol=.6){
    const o=c.createOscillator(), g=c.createGain(); o.type="sine";
    o.frequency.setValueAtTime(130,start); o.frequency.exponentialRampToValueAtTime(48,start+.35);
    g.gain.setValueAtTime(vol,start); g.gain.exponentialRampToValueAtTime(.001,start+.5);

  return hit.length?hit.map(x=>x.id):null}
function monthFrom(v){
  if(v==null||v==="")return"";
  if(v instanceof Date&&!isNaN(v))return`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}`;
  if(typeof v==="number"){
    if(v>=1900&&v<=2100)return String(v);
    const d=window.XLSX?.SSF?.parse_date_code?.(v);if(d)return`${d.y}-${String(d.m).padStart(2,"0")}`;return"";
  }
  const t=String(v).trim();let m;
  if(m=t.match(/^(\d{4})[-/.](\d{1,2})/))return`${m[1]}-${m[2].padStart(2,"0")}`;
  if(m=t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/)){const y=m[3].length===2?"20"+m[3]:m[3];return`${y}-${m[1].padStart(2,"0")}`}
  if(m=t.match(/^(\d{1,2})[-/.](\d{4})$/))return`${m[2]}-${m[1].padStart(2,"0")}`;
  const mi=MONTHS.findIndex(x=>new RegExp("\\b"+x,"i").test(t)),y=t.match(/\b(19|20)\d{2}\b/);
  if(y&&mi>=0)return`${y[0]}-${String(mi+1).padStart(2,"0")}`;
  if(y)return y[0];
  return"";
}
async function readExcel(file){
  if(!window.XLSX) await loadScript(XLSX_SRC);
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""}).filter(r=>r.some(c=>String(c).trim()!==""));
  if(!rows.length)return{rows:[],cols:null};
  const head=rows[0].map(normTxt), find=re=>head.findIndex(h=>re.test(h));
  let cols={who:find(/^(traveler|traveller|who|person|name|people)/),country:find(/country|nation/),city:find(/city|cities|town|place|port/),date:find(/date|when|month|year|visited/),times:find(/^(times|visits|trips|how many|count|n of)/)};
  let body=rows.slice(1);
  if(cols.country<0){ // no header row: guess the layout
    const first=rows[0]; const ci=first.findIndex(c=>findIso(c));
    cols={who:first.findIndex(c=>whoFrom(c)&&!findIso(c)),country:ci<0?0:ci,city:-1,date:-1,times:-1};
    const rest=first.map((_,i)=>i).filter(i=>i!==cols.country&&i!==cols.who);
    cols.city=rest.find(i=>!monthFrom(first[i]))??-1; cols.date=rest.find(i=>i!==cols.city)??-1;
    body=rows;
  }
  return{rows:body,cols};
}
function planImport(rows,cols,fallbackWho){
  const plan=new Map(), unknown=new Set(); let used=0;
  for(const r of rows){
    const cv=r[cols.country]; if(String(cv).trim()==="")continue;
    const iso=findIso(cv); if(!iso){unknown.add(String(cv).trim());continue}
    const w=(cols.who>=0?whoFrom(r[cols.who]):null)||[fallbackWho];
    const city=cols.city>=0?String(r[cols.city]).trim():"", month=cols.date>=0?monthFrom(r[cols.date]):"";
    for(const who of w){
      const key=`${who}_${iso}`; if(!plan.has(key))plan.set(key,{who,iso,cities:[]});
      const tn=cols.times>=0?parseInt(r[cols.times],10):NaN; if(tn>=1){const p=plan.get(key);p.times=Math.max(p.times||0,Math.min(99,tn))}
      if(city||month){const p=plan.get(key);p.cities=mergeCities(p.cities,splitCities(city).length?splitCities(city).map(n=>({name:n,month})):[{name:"",month}])}
    }
    used++;
  }
  return{plan:[...plan.values()],unknown:[...unknown],used};
}
async function applyImport(plan){
  let added=0,updated=0; const noteOf=l=>l.map(c=>c.name).filter(Boolean).join(", ");
  for(const it of plan){
    const id=`${it.who}_${it.iso}`, ex=visits.find(v=>v.id===id), cl=sortCities(it.cities);
    const tx=it.times?{times:it.times}:{};
    if(!ex){await store.set(id,{who:it.who,iso:it.iso,cities:cl,month:latestMonth(cl),note:noteOf(cl),createdAt:Date.now(),...tx});added++}
    else{const m=sortCities(mergeCities(citiesOf(ex),cl));const moreT=it.times&&it.times>timesOf(ex);if(m.length>citiesOf(ex).length||moreT){await store.update(id,{cities:m,month:latestMonth(m),note:noteOf(m),...(moreT?tx:{})});updated++}}
  }
  return{added,updated};
}
function openImport(file){
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="impTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="impTitle">Import from Excel</h2><button class="x" id="closeImp" type="button">Cancel</button></div>
    <div id="impBody" class="imp-body"><p class="imp-note">Reading ${esc(file.name)}…</p></div>
  </div></div>`;
  host.querySelector("#closeImp").onclick=closeSheet;
  const body=host.querySelector("#impBody");
  readExcel(file).then(({rows,cols})=>{
    if(!rows.length||!cols){body.innerHTML=`<p class="imp-note">That sheet is empty. Put one country per row, with columns Traveler, Country, City, Date.</p>`;return}
    const T=activeTravelers(); let who=T[0].id;
    const draw=()=>{
      const {plan,unknown,used}=planImport(rows,cols,who);
      const per=T.map(t=>({t,n:new Set(plan.filter(p=>p.who===t.id).map(p=>p.iso)).size}));
      const nC=plan.reduce((t,p)=>t+p.cities.filter(c=>c.name).length,0);
      body.innerHTML=`
        ${cols.who<0&&T.length>1?`<div><span class="lbl">No Traveler column. These rows are for</span><div class="seg" id="impWho" style="--n:${T.length}">
          ${T.map(t=>`<button type="button" class="tbtn" data-w="${t.id}" style="${styleOf(t.id)}" aria-pressed="${who===t.id}">${esc(t.name)}</button>`).join("")}</div></div>`:""}
        <div class="imp-sum" style="--n:${per.length+1}">${per.map(x=>`<div><b>${x.n}</b><span>${esc(x.t.name)}</span></div>`).join("")}<div><b>${nC}</b><span>Cities</span></div></div>
        <p class="imp-note">${used} ${used===1?"row":"rows"} read. Countries already on a list keep their entries; new cities are added to them.</p>
        ${unknown.length?`<div class="imp-warn"><b>${unknown.length} not recognized</b><span>${unknown.map(esc).join(", ")}</span><span>Check the spelling in Excel and import again, or add these with +.</span></div>`:""}
        <div class="actions"><button class="btn primary" id="doImport" type="button" ${plan.length?"":"disabled"}>Import ${plan.length} ${plan.length===1?"entry":"entries"}</button></div>`;
      body.querySelector("#impWho")?.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;who=b.dataset.w;draw()});
      body.querySelector("#doImport").onclick=async e=>{
        e.target.disabled=true; e.target.textContent="Importing…"; localChangeAt=Date.now();
        try{const r=await applyImport(plan);closeSheet();toast(`${r.added} added, ${r.updated} updated`)}
        catch(err){e.target.disabled=false;e.target.textContent="Try again";toast("Import stopped partway. Try again.")}
      };
    };
    draw();
  }).catch(()=>{body.innerHTML=`<p class="imp-note">Couldn't read that file. Use an Excel file (.xlsx or .xls) or a .csv, and make sure you're online the first time you import.</p>`});
}
async function downloadTemplate(){
  try{
    if(!window.XLSX) await loadScript(XLSX_SRC);
    const T=activeTravelers(), a=T[0].name, b=(T[1]||T[0]).name;
    const ws=XLSX.utils.aoa_to_sheet([["Traveler","Country","City","Date","Times"],[a,"Italy","Florence","2019-05",4],[b,"Italy","Venice","2019-05",3],[T.length>1?(T.length===2?"Both":"All"):a,"New Zealand","Auckland","2026-11",1]]);
    ws["!cols"]=[{wch:14},{wch:22},{wch:20},{wch:12},{wch:8}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Countries");
    XLSX.writeFile(wb,"thor-world-tally-template.xlsx"); toast("Saved thor-world-tally-template.xlsx");
  }catch(e){toast("Couldn't make the template. Check your connection.")}
}

/* ---------- Sync setup window ---------- */
function openSyncSetup(){
  const cur=syncConfig();
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="syncTitle">Sync your devices</h2><button class="x" id="closeSyncSet" type="button">Close</button></div>
    ${cur?`<p class="imp-note">Connected to Firebase project <b>${esc(cur.projectId||cur.databaseURL)}</b>. Your list is saved under <b>${COLL}</b>.</p>
      <div class="actions"><button class="btn danger" id="syncOff" type="button">Turn off sync on this device</button></div>`:
    `<p class="imp-note">Paste the <b>firebaseConfig</b> block from your Firebase project (Project settings → Your apps). Use the same project as your other apps. It must include <b>databaseURL</b>.</p>
      <textarea class="field cfg" id="cfgText" rows="7" spellcheck="false" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  projectId: &quot;…&quot;,&#10;  …&#10;};"></textarea>
      <p class="imp-note">Then on your phone: open © 2026 Thor → <b>Save as HTML</b> here, upload that file to GitHub, and every device that opens the site connects on its own.</p>
      <div class="actions"><button class="btn primary" id="syncOn" type="button">Connect</button></div>`}
  </div></div>`;
  host.querySelector("#closeSyncSet").onclick=closeSheet;
  host.querySelector("#syncOn")?.addEventListener("click",()=>{
    const cfg=parseFirebaseConfig(host.querySelector("#cfgText").value);
    if(!cfg){toast("That doesn't look like a Firebase config. It needs apiKey and databaseURL.");return}
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(cfg));localStorage.removeItem(SYNC_OFF)}catch(e){}
    toast("Connecting…"); setTimeout(()=>location.reload(),600);
  });
  host.querySelector("#syncOff")?.addEventListener("click",()=>{
    try{localStorage.removeItem(SYNC_KEY);localStorage.setItem(SYNC_OFF,"1")}catch(e){}
    toast("Sync turned off on this device"); setTimeout(()=>location.reload(),600);
  });
}

function openSaveWindow(){
  host.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="saveTitle">Save</h2><button class="x" id="closeSave" type="button">Close</button></div>
    <div class="save-grid">
      <button class="btn save-opt" id="saveHtml" type="button"><b>Save as HTML</b><span>The whole app with your list inside</span></button>
      <button class="btn save-opt" id="saveJson" type="button"><b>Save as JSON</b><span>Just your list, as a backup</span></button>
      <label class="btn save-opt" for="openJson"><b>Open a JSON file</b><span>Bring a saved list into this device</span></label>
      <input type="file" id="openJson" accept=".json,application/json" hidden>
      <label class="btn save-opt" id="xlsLbl" for="openXls"><b>Import from Excel</b><span>Start your list from a spreadsheet (.xlsx, .xls or .csv)</span></label>
      <input type="file" id="openXls" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
      <button class="btn save-opt" id="syncBtn" type="button"><b>Sync devices</b><span id="syncState"></span></button>
      <button class="linkbtn" id="getTemplate" type="button">Download an Excel template</button>
      <button class="btn save-opt" id="soundBtn" type="button"><b>Fanfare sound</b><span id="soundState"></span></button>
      <button class="linkbtn" id="testSound" type="button">Play the fanfare</button>
    </div>
    <div class="trav-box" id="travBox"></div>
    <div class="lock-row">
      <button class="lockbtn" id="masterLock" type="button"></button>
      <div class="lock-txt" id="masterTxt"></div>
    </div>
  </div></div>`;
  const lb=host.querySelector("#masterLock"), tx=host.querySelector("#masterTxt");
  const paint=()=>{
    lb.dataset.state=appUnlocked?"open":"locked";
    lb.innerHTML=appUnlocked?UNLOCK_SVG:LOCK_SVG;
    lb.setAttribute("aria-label",appUnlocked?"Lock editing":"Unlock editing");
    tx.innerHTML=appUnlocked?`<b>Editing unlocked</b><span>You can change any entry. Tap the lock when you're done.</span>`:`<b>Editing locked</b><span>Entries lock 48 hours after they're added. Tap to unlock and edit them.</span>`;
  };
  paint();
  lb.onclick=()=>{setUnlocked(!appUnlocked);paint();drawTrav()};
  host.querySelector("#closeSave").onclick=closeSheet;
  // travelers editor (needs the lock open)
  let draft=travelers.map(t=>({...t}));
  const box=host.querySelector("#travBox");
  const styleOfDraft=t=>{const c=PAL[t.color]||PAL[0];return `--tc:${c.c};--tp:${c.p};--te:${c.e}`};
  function drawTrav(){
    const on=draft.filter(t=>!t.hidden), off=draft.filter(t=>t.hidden), dis=appUnlocked?"":"disabled";
    box.innerHTML=`<div class="trav-head"><b>Travelers</b><span>${appUnlocked?`1 to ${MAX_TRAVELERS} people. Removing someone keeps their countries saved.`:"Unlock below to rename, add or remove travelers."}</span></div>
      <ul class="trav-list">${on.map(t=>`<li class="trav-row" style="${styleOfDraft(t)}"><span class="trav-dot"></span><input class="field" type="text" maxlength="24" placeholder="Name" value="${esc(t.name)}" data-id="${t.id}" aria-label="Traveler name" ${dis}><button type="button" class="cr-x" data-rm="${t.id}" aria-label="Remove ${esc(t.name)}" ${dis||(on.length<2?"disabled":"")}>×</button></li>`).join("")}</ul>
      ${off.length?`<div class="trav-off">${off.map(t=>`<button type="button" class="chip" data-restore="${t.id}" ${dis||(on.length>=MAX_TRAVELERS?"disabled":"")}>Restore ${esc(t.name)}</button>`).join("")}</div>`:""}
      <div class="actions"><button type="button" class="btn add-city" id="travAdd" ${dis||(on.length>=MAX_TRAVELERS?"disabled":"")}>+ Add traveler</button><button type="button" class="btn primary" id="travSave" ${dis}>Save travelers</button></div>`;
  }
  box.addEventListener("input",e=>{const i=e.target.closest("input[data-id]");if(!i)return;const t=draft.find(x=>x.id===i.dataset.id);if(t)t.name=i.value});
  box.addEventListener("click",async e=>{
    const rm=e.target.closest("[data-rm]"), rs=e.target.closest("[data-restore]");
    if(rm&&!rm.disabled){const t=draft.find(x=>x.id===rm.dataset.rm);if(t)t.hidden=true;drawTrav();return}
    if(rs&&!rs.disabled){const t=draft.find(x=>x.id===rs.dataset.restore);if(t)t.hidden=false;drawTrav();return}
    const add=e.target.closest("#travAdd");
    if(add&&!add.disabled){
      const used=new Set(draft.filter(t=>!t.hidden).map(t=>t.color));
      draft.push({id:"t"+Date.now().toString(36),name:"",color:[0,1,2,3].find(c=>!used.has(c))??0,hidden:false});
      drawTrav(); const ins=box.querySelectorAll("input[data-id]"); ins[ins.length-1]?.focus(); return}
    const sv=e.target.closest("#travSave");
    if(sv&&!sv.disabled){
      const known=new Set(travelers.map(t=>t.id));
      const list=draft.filter(t=>t.name.trim()||known.has(t.id)).map(t=>({...t,name:t.name.trim()||nameOf(t.id)}));
      if(!list.some(t=>!t.hidden)){toast("Keep at least one traveler.");return}
      await store.saveTravelers(list); draft=list.map(t=>({...t})); drawTrav(); toast("Travelers saved");
    }
  });
  drawTrav();
  host.querySelector("#saveHtml").onclick=()=>download(`thor-world-tally-${stamp()}.html`,buildHtml(),"text/html");
  host.querySelector("#saveJson").onclick=()=>download(`thor-world-tally-${stamp()}.json`,JSON.stringify({app:"Thor World Tally",saved:new Date().toISOString(),travelers,visits:exportData()},null,2),"application/json");
  host.querySelector("#openJson").addEventListener("change",e=>{const f=e.target.files[0];if(f)importJson(f)});
  host.querySelector("#openXls").addEventListener("change",e=>{const f=e.target.files[0];if(f)openImport(f)});
  host.querySelector("#getTemplate").onclick=downloadTemplate;
  const sc=syncConfig();
  host.querySelector("#syncState").textContent=sc?"On":"Off";
  host.querySelector("#syncBtn").onclick=openSyncSetup;
  const paintSound=()=>host.querySelector("#soundState").textContent=soundOn()?"On":"Off";
  paintSound();
  host.querySelector("#soundBtn").onclick=()=>{try{localStorage.setItem("countries-visited-sound",soundOn()?"off":"on")}catch(e){}paintSound();if(soundOn())playFanfare()};
  host.querySelector("#testSound").onclick=()=>{if(!soundOn()){toast("Turn the fanfare sound on first");return}playFanfare()};
}
document.getElementById("thorBtn").onclick=openSaveWindow;

document.getElementById("viewList").addEventListener("click",e=>{
  const m=e.target.closest(".more");
  if(m){const id=m.dataset.open;openCities.has(id)?openCities.delete(id):openCities.add(id);render();return}
  const b=e.target.closest(".item");if(b)openEdit(b.dataset.id);
});

render();
boot();
</script>
